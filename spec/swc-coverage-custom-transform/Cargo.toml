[package]
edition = "2021"
name    = "swc-coverage-custom-transform"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2.4.1"

[dependencies]
anyhow = "1.0.104"
backtrace = "0.3.76"
napi = { version = "3.12.2", default-features = false, features = [
  "napi3",
  "serde-json",
] }
napi-derive = { version = "3.6.3", default-features = false, features = [
  "type-def",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
swc-coverage-instrument = { version = "0.0.33", path = "../../packages/swc-coverage-instrument" }
swc_core = { version = "77.0.2", features = [
  "common_concurrent",
  "ecma_transforms",
  "ecma_transforms_module",
  "base_module",
  "ecma_ast",
  "allocator_node",
  "ecma_visit",
  "base_node",
] }
swc_error_reporters = { version = "28.0.0" }
